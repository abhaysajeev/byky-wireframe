<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Sora',sans-serif;background:#f4f5fa;color:#1a1640}
  a{color:#d81f26;text-decoration:none}
  a:hover{color:#a8161c}
  .sb::-webkit-scrollbar{width:6px}
  .sb::-webkit-scrollbar-thumb{background:#e2e2ee;border-radius:99px}
  .sb::-webkit-scrollbar-track{background:transparent}
</style>
</helmet>

<div style="display:flex;height:100vh;min-height:600px;overflow:hidden;background:#f4f5fa">

  <aside style="width:{{ railW }};flex:0 0 auto;background:#fff;border-right:1px solid #e8e8f0;display:flex;flex-direction:column;transition:width .22s cubic-bezier(.4,0,.2,1);position:relative;z-index:2">

    <div style="display:flex;align-items:center;gap:10px;padding:18px 16px 14px 20px">
      <img src="./byky-mark.png" alt="Byky" style="width:34px;height:auto;flex:0 0 auto" />
      <div style="flex:1;min-width:0;overflow:hidden;opacity:{{ labelOpacity }};transition:opacity .16s">
        <div style="font-size:19px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;line-height:1.1">
          <span style="color:#1a1640">Byky</span><span style="color:#d81f26">RMS</span>
        </div>
        <div style="font-size:10.5px;font-weight:500;color:#9490bb;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;margin-top:2px">Rental Management</div>
      </div>
      <button onClick="{{ toggleRail }}" title="Collapse menu" style="flex:0 0 auto;width:26px;height:26px;border:1.5px solid #e0e0ee;background:#fff;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#9490bb;transition:all .16s" style-hover="border-color:#d81f26;color:#d81f26">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-width="1.8"></circle><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"></circle></svg>
      </button>
    </div>

    <nav class="sb" style="flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 12px 24px">

      <div style="margin-bottom:14px">
        <a href="#" style="display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:10px;background:linear-gradient(100deg,#c2141a 0%,#e8272e 55%,#f04a50 100%);color:#fff;box-shadow:0 6px 16px -6px rgba(216,31,38,.55);font-size:14.5px;font-weight:600">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.8V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.8"></path></svg>
          <span style="white-space:nowrap;opacity:{{ labelOpacity }};transition:opacity .16s">Dashboard</span>
        </a>
      </div>

      <sc-for list="{{ sections }}" as="section" hint-placeholder-count="3">
        <div style="margin-bottom:10px">
          <div style="padding:10px 14px 8px;font-size:11px;font-weight:600;letter-spacing:1.1px;color:#a9a6c4;text-transform:uppercase;white-space:nowrap;overflow:hidden;opacity:{{ labelOpacity }}">{{ section.header }}</div>

          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="6">
            <div>
              <a href="#" onClick="{{ item.toggle }}" style="display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#4b4770;font-size:14px;font-weight:500;transition:background .14s,color .14s" style-hover="background:#f6f5fc;color:#1a1640">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;color:#6b6790"><path d="{{ item.icon }}"></path></svg>
                <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:{{ labelOpacity }}">{{ item.name }}</span>
                <span style="flex:0 0 auto;min-width:26px;height:20px;padding:0 7px;border-radius:99px;background:#eeedf5;color:#7d7aa0;font-size:11.5px;font-weight:600;display:grid;place-items:center;opacity:{{ labelOpacity }}">{{ item.count }}</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;color:#b6b3ce;transform:{{ item.caret }};transition:transform .18s;opacity:{{ labelOpacity }}"><path d="m9 6 6 6-6 6"></path></svg>
              </a>
              <sc-if value="{{ item.open }}" hint-placeholder-val="{{ false }}">
                <ul style="list-style:none;margin:2px 0 6px;padding-left:31px;border-left:1.5px solid #eeedf5;margin-left:23px">
                  <sc-for list="{{ item.submenu }}" as="sub" hint-placeholder-count="3">
                    <li>
                      <a href="#" style="display:block;padding:8px 12px;border-radius:8px;font-size:13.5px;font-weight:450;color:#6b6790;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" style-hover="background:#f6f5fc;color:#d81f26">{{ sub }}</a>
                    </li>
                  </sc-for>
                </ul>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </nav>

  </aside>

  <main style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden">
    <header style="height:64px;flex:0 0 auto;background:#fff;border-bottom:1px solid #e8e8f0;display:flex;align-items:center;gap:16px;padding:0 24px">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;max-width:380px;background:#f6f5fc;border:1px solid #eeedf5;border-radius:9px;padding:9px 12px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9490bb" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg>
        <span style="font-size:13px;color:#a9a6c4">Search vehicles, riders, stations…</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:36px;height:36px;border-radius:9px;background:#f6f5fc;display:grid;place-items:center;color:#6b6790">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
        </div>
        <div style="width:36px;height:36px;border-radius:9px;background:#f6f5fc;display:grid;place-items:center;color:#6b6790">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14a1.7 1.7 0 0 0-1.6-1H1a2 2 0 1 1 0-4h.4A1.7 1.7 0 0 0 3 7.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 3V2a2 2 0 1 1 4 0v.4A1.7 1.7 0 0 0 16 4.6l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10a1.7 1.7 0 0 0 1.6 1H22a2 2 0 1 1 0 4h-.4a1.7 1.7 0 0 0-1.2.9z"></path></svg>
        </div>
      </div>
    </header>
    <div style="flex:1;overflow-y:auto;padding:28px 24px">
      <div style="max-width:1100px">
        <h1 style="font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:4px">Dashboard</h1>
        <p style="font-size:13.5px;color:#9490bb;margin-bottom:22px">Content area placeholder — the sidebar is the piece being rebuilt.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
          <div style="background:#fff;border:1px solid #eeedf5;border-radius:12px;height:110px"></div>
          <div style="background:#fff;border:1px solid #eeedf5;border-radius:12px;height:110px"></div>
          <div style="background:#fff;border:1px solid #eeedf5;border-radius:12px;height:110px"></div>
        </div>
      </div>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const MENU = [
  { header: 'Operations', items: [
    { name: 'Company Management', count: 9, icon: 'M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 7h3M8 11h3M8 15h3',
      submenu: ['Companies', 'Branches', 'Departments', 'Designations', 'Documents', 'Contracts', 'Vendors', 'Approvals', 'Settings'] },
    { name: 'Human Resources', count: 6, icon: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0 .01M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
      submenu: ['Employees', 'Attendance', 'Leaves', 'Payroll', 'Shifts', 'Roles'] },
    { name: 'Inventory', count: 20, icon: 'm12 2 9 5v10l-9 5-9-5V7l9-5M3.3 7 12 12l8.7-5M12 12v10',
      submenu: ['Vehicles', 'Spare Parts', 'Stock In', 'Stock Out', 'Warehouses', 'Suppliers', 'Purchase Orders', 'Audits'] },
    { name: 'Rental Management', count: 8, icon: 'M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2M8 7h7M8 11h7',
      submenu: ['Bookings', 'Active Rentals', 'Returns', 'Extensions', 'Damages', 'Refunds', 'Agreements', 'History'] },
    { name: 'Fare & Schemes', count: 2, icon: 'm2.5 12.5 9-9a2 2 0 0 1 1.4-.6H20a1 1 0 0 1 1 1v7.1a2 2 0 0 1-.6 1.4l-9 9a1.5 1.5 0 0 1-2.1 0l-6.8-6.8a1.5 1.5 0 0 1 0-2.1M16.5 7.5h.01',
      submenu: ['Fare Plans', 'Promo Schemes'] },
    { name: 'Tracking & Telematics', count: 4, icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M15.6 8.4l-2 5.2-5.2 2 2-5.2z',
      submenu: ['Live Map', 'Trip History', 'Geofences', 'Device Health'] },
    { name: 'RFID Gates', count: 5, icon: 'M5 19a1 1 0 1 0 0-2 1 1 0 0 0 0 2M9 20a5 5 0 0 0-5-5M13.5 20.5A9.5 9.5 0 0 0 4 11M18 21A14 14 0 0 0 4 7M22 21A18 18 0 0 0 4 3',
      submenu: ['Gates', 'Tags', 'Access Logs', 'Rules', 'Diagnostics'] }
  ]},
  { header: 'Business', items: [
    { name: 'Reports', count: 8, icon: 'M4 4a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM8 16v-4M12 16V8M16 16v-6',
      submenu: ['Revenue', 'Utilisation', 'Fleet Health', 'Rider Activity', 'Collections', 'Taxes', 'Custom Reports', 'Exports'] },
    { name: 'Sales Force', count: 6, icon: 'm3 17 5.5-6.5 4 3.5L21 6M21 6h-5M21 6v5',
      submenu: ['Agents', 'Targets', 'Leads', 'Visits', 'Commissions', 'Leaderboard'] },
    { name: 'Mobile App', count: 7, icon: 'M7 2h10a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1M11 18h2',
      submenu: ['Rider App', 'Onboarding', 'Banners', 'Versions', 'Push Config', 'Feedback', 'Crash Logs'] },
    { name: 'Notifications', count: 5, icon: 'M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0',
      submenu: ['Templates', 'Campaigns', 'SMS', 'Email', 'Logs'] },
    { name: 'Wallet & Payments', count: 5, icon: 'M3 7a2 2 0 0 1 2-2h11l4 4v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM16 13h2',
      submenu: ['Wallets', 'Top-ups', 'Transactions', 'Gateways', 'Settlements'] }
  ]},
  { header: 'System', items: [
    { name: 'Scheduler', count: 5, icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3.5 2',
      submenu: ['Jobs', 'Cron Tasks', 'Queues', 'Run History', 'Failures'] },
    { name: 'System Administration', count: 5, icon: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-2.87 1.2V21a2 2 0 1 1-4 0v-.11A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 2.6 15H2.5a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.6 7a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 2.6V2.5a2 2 0 1 1 4 0v.11A1.7 1.7 0 0 0 16 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 21.4 9h.1a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.19 1.19',
      submenu: ['Users', 'Roles & Permissions', 'Audit Trail', 'Backups', 'Configuration'] },
    { name: 'Mobile API', count: 5, icon: 'M4 7h3.5a2 2 0 0 1 0 4H4v6M4 7v4M11 17V7h2.5a2 2 0 0 1 0 5H11M18 7v10',
      submenu: ['Endpoints', 'API Keys', 'Webhooks', 'Rate Limits', 'Docs'] },
    { name: 'System Security', count: 5, icon: 'M12 22s8-4 8-10V5.5L12 2 4 5.5V12c0 6 8 10 8 10M9 12l2.2 2.2L15.5 10',
      submenu: ['Login Policy', 'Sessions', 'IP Allowlist', 'Encryption', 'Alerts'] }
  ]}
];

class Component extends DCLogic {
  state = { collapsed: false, open: null };

  renderVals() {
    const { collapsed, open } = this.state;
    const sections = MENU.map((s, si) => ({
      header: s.header,
      items: s.items.map((it, ii) => {
        const key = si + '-' + ii;
        const isOpen = open === key && !collapsed;
        return {
          ...it,
          open: isOpen,
          caret: isOpen ? 'rotate(90deg)' : 'rotate(0deg)',
          toggle: (e) => {
            e.preventDefault();
            this.setState(st => ({ open: st.open === key ? null : key }));
          }
        };
      })
    }));
    return {
      sections,
      railW: collapsed ? '84px' : '292px',
      labelOpacity: collapsed ? 0 : 1,
      toggleRail: () => this.setState(st => ({ collapsed: !st.collapsed, open: null }))
    };
  }
}

</script>
</body>
</html>
